[project]
name = "newmarketsimulation"
version = "0.1.0"
description = "Westfield Newmarket pedestrian simulation and mall visitor trends"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-cloud-bigquery>=3.41",
    "db-dtypes>=1.6",
    "pandas>=2.2",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mall_trends"]

[project.scripts]
newmarket-trends = "mall_trends.run:main"
newmarket-materialize = "mall_trends.materialize:main"
